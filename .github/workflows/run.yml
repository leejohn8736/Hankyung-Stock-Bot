name: Hankyung Stock Bot

on:
  schedule:
    # 매 12분마다 상시 실행 (UTC 기준 매일 실행, 파이썬 코드 내부에서 KST 04~21시 여부를 정밀 필터링합니다)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 🐍 Python 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 수혜종목 스캔 및 텔레그램 발송 실행
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
