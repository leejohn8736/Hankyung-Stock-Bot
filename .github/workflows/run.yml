name: Stock Ranking Alert Bot

on:
  schedule:
    # 한국 시간(KST) 기준 매일 06:00 ~ 21:00 사이 2시간 간격
    - cron: '0 21,23,1,3,5,7,9,11,12 * * *'
  workflow_dispatch: # 수동 테스트 실행 버튼 제공

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # FinanceDataReader 호환을 위해 3.11 버전 사용
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
