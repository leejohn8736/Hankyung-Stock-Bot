name: Hankyung Stock Bot

on:
  schedule:
    # KST 기준 04:00 ~ 21:00 매 12분마다 실행 (UTC 기준 19:00 ~ 12:00)
    # 0,12,24,36,48 분마다 실행
    - cron: '*/12 19-12 * * *'
  workflow_dispatch: # 깃허브 웹에서 수동으로 즉시 실행할 수 있는 버튼 제공

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 🐍 Python 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 수혜종목 스캔 및 텔레그램 발송 실행
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
